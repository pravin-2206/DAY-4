<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        .img {
            display: flex;
            margin-top: 10px;
        }
        .container {
            display: flex;
            width: 700px;
            box-shadow: 1px 0px 5px rgba(0, 0, 0, 0.3);
            height: 200px;
        }
        .info {
            margin-left: 10px;
        }
        .super {
            font-weight: bold;
        }
        .super span {
            color: gray;
        }
        .youtube-box {
            display: flex;
            flex-direction: row;
            border-radius: 10px;
            border: solid gray 2px;
            overflow: hidden;
        }
        .col1 {
            width: 100px;
            background-color: gray;
        }
        .col2 {
            padding-left: 10px;
        }
        .p1 {
            color: gray;
            margin-bottom: 5px;
        }
        .p2 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img">
            <img src="cat.jpg" alt="cat">
        </div>
        <div class="info">
            <div class="infor-written">
                <p class="super">
                    supersimple.dev <span>@SuperSimpleDev</span>
                </p>
                <p class="sub">
                    What is backend web development? A complete overview. New Video is up!
                </p>
            </div>
            <div class="youtube-box">
                <div class="col1">
                </div>
                <div class="col2">
                    <p class="p1">youtube.com</p>
                    <p class="p2">
                        Backend web development - a complete overview (2021)
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
