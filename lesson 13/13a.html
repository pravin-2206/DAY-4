<html>
  <head>
    <style>
        .flexbox{
            display: flex;
            flex-direction: row;
        }
        .column1{
            background-color: pink;
            width: 100px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 5px 30px;
        }
        .item1{
            background-color: black;
            color: white;
        }
        .column2{
            width: 200px;
            background-color: lightblue;
        }
    </style>
  </head>
  <body>
    <div class="flexbox">
      <div class="column1">
        <div class="item1">item1</div>
      </div>
      <div class="column2"></div>
    </div>
  </body>
</html>
