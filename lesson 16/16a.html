```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Roboto, Arial;
        }

        .header {
            height: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
        }

        .left-section {
            display: flex;
            align-items: center;
        }

        .hamburger-menu {
            width: 24px;
            margin-right: 25px;
        }

        .youtube-logo {
            width: 90px;
        }

        .middle-section {
            display: flex;
            align-items: center;
            flex: 1;
            max-width: 600px;
            margin-left: 50px;
        }

        .search-bar {
            height: 36px;
            flex: 1;
            border: 1px solid #ccc;
            padding-left: 12px;
            font-size: 16px;
        }

        .search-button {
            height: 40px;
            width: 64px;
            border: 1px solid #ccc;
            background-color: #f8f8f8;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .search-icon {
            width: 24px;
        }

        .voice-search-button {
            height: 40px;
            width: 40px;
            border: none;
            border-radius: 50%;
            margin-left: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .voice-search-icon {
            width: 24px;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .upload-icon-container,
        .youtube-apps-icon-container,
        .notifications-icon-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .upload-icon,
        .youtube-apps-icon,
        .notifications-icon {
            width: 24px;
        }

        .notifications-count {
            position: absolute;
            top: -5px;
            right: -5px;

            background-color: red;
            color: white;

            font-size: 10px;

            padding: 2px 5px;
            border-radius: 50%;
        }

        .current-user-picture {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        .search-button .tooltip,
        .voice-search-button .tooltip,
        .upload-icon-container .tooltip,
        .youtube-apps-icon-container .tooltip,
        .notifications-icon-container .tooltip {

            font-family: Roboto, Arial;

            position: absolute;

            background-color: gray;
            color: white;

            padding-top: 4px;
            padding-bottom: 4px;
            padding-left: 8px;
            padding-right: 8px;

            border-radius: 2px;

            font-size: 12px;

            bottom: -30px;

            opacity: 0;

            transition: opacity 0.15s;

            pointer-events: none;

            white-space: nowrap;

            z-index: 100;
        }

        .search-button:hover .tooltip,
        .voice-search-button:hover .tooltip,
        .upload-icon-container:hover .tooltip,
        .youtube-apps-icon-container:hover .tooltip,
        .notifications-icon-container:hover .tooltip {

            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="left-section">
            <img class="hamburger-menu" src="https://www.svgrepo.com/show/506800/menu.svg">
            <img class="youtube-logo" src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg">
        </div>
        <div class="middle-section">
            <input class="search-bar" type="text" placeholder="Search">


            <button class="search-button">

                <img class="search-icon" src="https://www.svgrepo.com/show/532555/search.svg">

                <div class="tooltip">
                    Search
                </div>

            </button>


            <button class="voice-search-button">

                <img class="voice-search-icon" src="https://www.svgrepo.com/show/513039/microphone.svg">

                <div class="tooltip">
                    Search with your voice
                </div>

            </button>

        </div>
        <div class="right-section">
            <div class="upload-icon-container">
                <img class="upload-icon" src="https://www.svgrepo.com/show/209295/youtube-upload.svg">
                <div class="tooltip">
                    Create
                </div>
            </div>
            <div class="youtube-apps-icon-container">
                <img class="youtube-apps-icon" src="https://www.svgrepo.com/show/341368/apps.svg">
                <div class="tooltip">
                    YouTube Apps
                </div>
            </div>
            <div class="notifications-icon-container">
                <img class="notifications-icon" src="https://www.svgrepo.com/show/506778/notification-bell.svg">

                <div class="notifications-count">
                    3
                </div>

                <div class="tooltip">
                    Notifications
                </div>
            </div>
            <img class="current-user-picture" src="https://i.pravatar.cc/100?img=12">
        </div>
    </div>
</body>

</html>
