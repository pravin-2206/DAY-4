<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two Images With Links</title>
<style>
  .image-row {
    display: flex;
    gap: 20px;
    padding: 20px;
    font-family: Arial, sans-serif;
  }

  .image-card {
    width: 300px;
  }

  .image-card img {
    width: 100%;
    display: block;
    border-radius: 8px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .image-card a:hover img {
    transform: scale(1.03);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>

  <div class="image-row">

    <!-- Image 1 -->
    <div class="image-card">
      <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY" target="_blank" rel="noopener noreferrer">
        <img src="https://i.ytimg.com/vi/n2RNcPRtAiY/hqdefault.jpg" alt="Video 1">
      </a>
    </div>

    <!-- Image 2 -->
    <div class="image-card">
      <a href="https://www.youtube.com/watch?v=mP0RAo9SKZk" target="_blank" rel="noopener noreferrer">
        <img src="https://i.ytimg.com/vi/mP0RAo9SKZk/hqdefault.jpg" alt="Video 2">
      </a>
    </div>

  </div>

</body>
</html>
