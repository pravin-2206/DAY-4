<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 400px;
            height: 400px;
            object-fit: cover;
        }
        .container {
            position: relative;
            display: inline-block;
        }
        .dis {
            position: absolute;
            right: 0px;
            top: 0px;
            background-color: black;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img">
            <img src="/shirt.jpg" alt="">
        </div>
        <div class="dis">
            20% off
        </div>
        
    </div>
</body>
</html>
